version = 1

[*]
threads = 12
flash-attn = on

#
#mmap = off
#direct-io = on
load-mode = none

fit = off
warmup = off
batch-size = 4096
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
cache-prompt = true
cache-reuse = 256

cache-ram = 0
#cache-ram = 32768

#
# Whoever wrote the parser for this is a sadist
#
# [foo]         <-- router entry
# hf-repo = ... <-- where we get the gguf
# alias = foo   <-- name advertised by the child llama-server


# ------------------------------------------------------------
# EVERYDAY WRITING
# ------------------------------------------------------------

[writer]
hf-repo = unsloth/Qwen3.5-35B-A3B-GGUF:Q5_K_M
alias = writer
n-gpu-layers = 999
ctx-size = 128000
temp = 0.9
top-p = 0.95
top-k = 40
min-p = 0.02

# ------------------------------------------------------------
# CODING
# ------------------------------------------------------------

[coder]
hf-repo = unsloth/Qwen3-Coder-Next-GGUF:UD-Q6_K_XL
alias = coder
n-gpu-layers = 999
ctx-size = 128000
temp = 1.0
top-p = 0.95
top-k = 40
min-p = 0.01

# ------------------------------------------------------------
# GPT-OSS / REASONING
# ------------------------------------------------------------


[reasoner]
hf-repo = unsloth/gpt-oss-120b-GGUF:UD-Q8_K_XL
alias = reasoner
n-gpu-layers = 999
ctx-size = 65536
temp = 0.6
min-p = 0.05
chat-template-kwargs = {"reasoning_effort": "high"}

# ------------------------------------------------------------
# LAMA 4 SCOUT (multimodal)
# ------------------------------------------------------------

[visionary]
hf-repo = unsloth/Llama-4-Scout-17B-16E-Instruct-GGUF:UD-Q4_K_XL
alias = visionary
n-gpu-layers = 999
ctx-size = 131072

# ------------------------------------------------------------
# LARGE QWEN — SLOWER EDITOR / CRITIC
# ------------------------------------------------------------

[editor]
hf-repo = unsloth/Qwen3.5-122B-A10B-MTP-GGUF
alias = editor
n-gpu-layers = 999
ctx-size = 128000
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
ubatch-size = 2048
cache-type-k = q4_0
cache-type-v = q4_0
cache-reuse = 0
